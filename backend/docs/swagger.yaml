        in: path
        name: id
        required: true
        type: string
      - description: 'Target role: admin (super_admin only), mentor, or student'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User role updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid role value (must be admin, mentor, or student)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - Invalid or missing JWT token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - only super_admin may assign admin role, or insufficient
            permission for target user
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
        "500":
