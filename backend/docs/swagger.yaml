basePath: /
definitions:
  dto.APIResponse:
    properties:
      data:
        $ref: '#/definitions/dto.CreatePaymentResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.CreateCourseReviewRequest:
    properties:
      comment:
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - comment
    - rating
    type: object
  dto.CreateModuleRequest:
    properties:
      course_id:
        example: 1
        type: integer
      order_index:
        example: 1
        type: integer
      title:
        example: Module 1
        type: string
    required:
    - course_id
    - order_index
    - title
    type: object
  dto.CreatePaymentRequest:
    properties:
      amount:
        type: integer
      callback_url:
        type: string
      enrollment_id:
        type: integer
      method:
        enum:
        - PERMATAVA
        - BNIVA
        - BRIVA
        - MANDIRIVA
        - BCAVA
        - MUAMALATVA
        - CIMBVA
        - BSIVA
        - OCBCVA
        - DANAMONVA
        - OVO
        - DANA
        - QRIS2
        type: string
      order_items:
        items:
          $ref: '#/definitions/dto.OrderItem'
        minItems: 1
        type: array
      return_url:
        type: string
    required:
    - amount
    - method
    - order_items
    type: object
  dto.CreatePaymentResponse:
    properties:
      amount:
        type: integer
      amount_received:
        type: integer
      callback_url:
        type: string
      checkout_url:
        type: string
      customer_email:
        type: string
      customer_name:
        type: string
      customer_phone:
        type: string
      expired_time:
        type: integer
      fee_customer:
        type: integer
      fee_merchant:
        type: integer
      instructions:
        items:
          $ref: '#/definitions/dto.PaymentInstruction'
        type: array
      merchant_ref:
        type: string
      order_items:
        items:
          $ref: '#/definitions/dto.OrderItemResponse'
        type: array
      pay_code:
        type: string
      pay_url: {}
      payment_method:
        type: string
      payment_name:
        type: string
      payment_selection_type:
        type: string
      qr_string: {}
      qr_url: {}
      reference:
        type: string
      return_url:
        type: string
      status:
        type: string
      total_fee:
        type: integer
    type: object
  dto.LessonAttendanceCreateRequest:
    properties:
      enrollment_id:
        type: integer
      lesson_id:
        type: integer
      note:
        type: string
      status:
        enum:
        - present
        - late
        - absent
        - excused
        type: string
    required:
    - enrollment_id
    - lesson_id
    type: object
  dto.LessonAttendanceUpdateRequest:
    properties:
      note:
        type: string
      status:
        enum:
        - present
        - late
        - absent
        - excused
        type: string
    type: object
  dto.LessonCreateRequest:
    properties:
      content:
        description: accepts any JSON value
      end_time:
        description: RFC3339 format
        type: string
      module_id:
        type: integer
      order_index:
        type: integer
      start_time:
        description: RFC3339 format
        type: string
      title:
        type: string
      video_url:
        type: string
    required:
    - module_id
    - title
    type: object
  dto.LessonUpdateRequest:
    properties:
      content:
        description: accepts any JSON value
      end_time:
        description: RFC3339 format
        type: string
      module_id:
        type: integer
      order_index:
        type: integer
      start_time:
        description: RFC3339 format
        type: string
      title:
        type: string
      video_url:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: StrongPassword123
        type: string
    required:
    - email
    - password
    type: object
  dto.OrderItem:
    properties:
      image_url:
        type: string
      name:
        type: string
      price:
        type: integer
      product_url:
        type: string
      quantity:
        type: integer
      sku:
        type: string
    required:
    - name
    - price
    - quantity
    type: object
  dto.OrderItemResponse:
    properties:
      image_url:
        type: string
      name:
        type: string
      price:
        type: integer
      product_url:
        type: string
      quantity:
        type: integer
      sku:
        type: string
      subtotal:
        type: integer
    type: object
  dto.PaymentInstruction:
    properties:
      steps:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      name:
        example: User DU
        type: string
      password:
        example: StrongPassword123
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.UpdateModuleRequest:
    properties:
      order_index:
        example: 2
        type: integer
      title:
        example: Updated Module 1
        type: string
    type: object
  dto.UpdateUserProfileRequest:
    properties:
      description:
        type: string
      email:
        type: string
      name:
        type: string
    type: object
  dto.UpdateUserRoleRequest:
    properties:
      role:
        example: admin
        type: string
    required:
    - role
    type: object
host: localhost:8080
info:
  contact: {}
  description: Documentation for Web DU Backend API.
  title: Web DU Backend
  version: "1.0"
paths:
  /avatar:
    post:
      consumes:
      - multipart/form-data
      description: Upload and update authenticated user's avatar image. Only authenticated
        users can access this endpoint.
      parameters:
      - description: 'Avatar image file (max 5MB, supported: JPG, PNG, GIF)'
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Avatar updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Failed to process avatar file
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
        "413":
          description: File size exceeds 5MB limit
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user avatar (All Roles)
      tags:
      - User
  /courses:
    get:
      consumes:
      - application/json
      description: Retrieve paginated list of courses with optional filters (mentor_id,
        title, price, is_premium)
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: per_page
        type: integer
      - description: Filter by mentor ID
        in: query
        name: mentor_id
        type: integer
      - description: Search by title (case-insensitive)
        in: query
        name: title
        type: string
      - description: Filter by exact price
        in: query
        name: price
        type: number
      - description: Filter by premium status
        in: query
        name: is_premium
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Courses retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to retrieve courses
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all courses with pagination and filters (All Roles)
      tags:
      - Course
    post:
      consumes:
      - multipart/form-data
      description: Create a new course with details and optional thumbnail. Admin
        only.
      parameters:
      - description: Course title
        in: formData
        name: title
        required: true
        type: string
      - description: Course slug (unique identifier, lowercase with hyphens)
        in: formData
        name: slug
        required: true
        type: string
      - description: Course description
        in: formData
        name: description
        required: true
        type: string
      - description: Course thumbnail image (JPG, PNG recommended)
        in: formData
        name: thumbnail
        type: file
      - description: Course price in cents
        in: formData
        name: price
        required: true
        type: integer
      - description: Course slot capacity (0 = unlimited)
        in: formData
        name: slot
        required: true
        type: integer
      - description: 'Whether course is premium (default: false)'
        in: formData
        name: is_premium
        required: true
        type: boolean
      - description: 'Whether course is published (default: false)'
        in: formData
        name: is_published
        required: true
        type: boolean
      produces:
      - application/json
      responses:
        "201":
          description: Course created successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Admins only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to create course
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create new course (Admin Only)
      tags:
      - Course
  /courses/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve complete information of a specific course including all
        modules
      parameters:
      - description: Course ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Course retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Course not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get course by ID (All Roles)
      tags:
      - Course
  /courses/{id}/join:
    post:
      consumes:
      - application/json
      description: Allow authenticated students to enroll in a course. Creates an
        enrollment record.
      parameters:
      - description: Course ID to enroll in
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Successfully enrolled in course
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Already enrolled in this course
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Students only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Course or user not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to join course
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Join a course (Student Only)
      tags:
      - Course
  /courses/{id}/review:
    post:
      consumes:
      - application/json
      description: Create a review for a course. User must be enrolled in the course
        with active status. Each user can only submit one review per course. Review
        comments are encrypted before storage.
      parameters:
      - description: Course ID
        in: path
        name: id
        required: true
        type: integer
      - description: Review data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCourseReviewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Review created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid course ID or request body
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: User not enrolled in course
          schema:
            additionalProperties: true
            type: object
        "409":
          description: User already reviewed this course
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create course review (Enrolled Students Only)
      tags:
      - Course
  /courses/{id}/students:
    get:
      consumes:
      - application/json
      description: Retrieve list of all students enrolled in a specific course. Admin
        only endpoint.
      parameters:
      - description: Course ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Students retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Admins only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Course not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to retrieve students
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all enrolled students in a course (Admin Only)
      tags:
      - Course
  /enrollments/{enrollment_id}/invoice:
    get:
      consumes:
      - application/json
      description: Retrieve or generate invoice for a specific enrollment
      parameters:
      - description: Enrollment ID
        in: path
        name: enrollment_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Invoice retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Enrollment not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to retrieve invoice
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get course enrollment invoice (All Roles)
      tags:
      - Course
  /invoices/url:
    get:
      consumes:
      - application/json
      description: Retrieve invoice URL by providing enrollment_id, user_id, and course_id
        as query parameters
      parameters:
      - description: Enrollment ID
        in: query
        name: enrollment_id
        required: true
        type: integer
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      - description: Course ID
        in: query
        name: course_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Invoice URL retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing required parameters
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Enrollment not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get invoice URL by enrollment details (All Roles)
      tags:
      - Invoice
  /lessons:
    get:
      consumes:
      - application/json
      description: Retrieve paginated list of all lessons with optional module_id
        filter. Admin only.
      parameters:
      - description: 'Page number (default: 1, minimum: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: per_page
        type: integer
      - description: Filter by module ID
        in: query
        name: module_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Lessons retrieved successfully with pagination metadata
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Admins only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to retrieve lessons
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all lessons with pagination (Admin Only)
      tags:
      - Lesson
    post:
      consumes:
      - application/json
      description: Create a new lesson for a module. Admin only. Requires module_id
        and title. Content and video_url are optional.
      parameters:
      - description: Lesson data with module_id, title, content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LessonCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Lesson created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request data
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Admins only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User or module not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to create lesson
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create new lesson (Admin Only)
      tags:
      - Lesson
  /lessons/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a lesson by ID (Admin only)
      parameters:
      - description: Lesson ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Lesson deleted successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Admins only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Lesson not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to delete lesson
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete lesson (Admin Only)
      tags:
      - Lesson
    get:
      consumes:
      - application/json
      description: Retrieve detailed information of a specific lesson. Admin only.
      parameters:
      - description: Lesson ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Lesson retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Admins only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Lesson or user not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to retrieve lesson
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get lesson by ID (Admin Only)
      tags:
      - Lesson
    put:
      consumes:
      - application/json
      description: Update an existing lesson by ID. Admin only. All fields are optional
        - only provided fields will be updated.
      parameters:
      - description: Lesson ID to update
        in: path
        name: id
        required: true
        type: integer
      - description: Updated lesson data (all fields optional)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LessonUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Lesson updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request data
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Admins only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Lesson or user not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to update lesson
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update lesson (Admin Only)
      tags:
      - Lesson
  /lessons/attendances:
    post:
      consumes:
      - application/json
      description: Students can only check in once per lesson. Status is set automatically
        based on lesson start time.
      parameters:
      - description: Attendance data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LessonAttendanceCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Attendance recorded successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request data
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Lesson or enrollment not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Already checked in for this lesson
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to record attendance
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Check in attendance for a lesson (Student Only)
      tags:
      - Lesson Attendance
  /lessons/attendances/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an attendance record by ID. Admin only.
      parameters:
      - description: Attendance ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Attendance deleted successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Admins only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Attendance not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to delete attendance
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete attendance record (Admin Only)
      tags:
      - Lesson Attendance
    get:
      consumes:
      - application/json
      description: Retrieve a specific attendance record by ID. Admin only.
      parameters:
      - description: Attendance ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Attendance retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Admins only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User or attendance not found
