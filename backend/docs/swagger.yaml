        "403":
          description: 'Access denied: Admins only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Module or user not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to delete module
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete module (Admin Only)
