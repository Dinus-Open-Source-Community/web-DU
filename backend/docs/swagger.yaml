        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Module not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to retrieve module
          schema:
            additionalProperties: true
            type: object
