  /oauth/google:
    get:
      consumes:
      - application/json
      description: Initiates Google OAuth 2.0 authentication flow. Redirects user
        to Google consent screen.
      produces:
      - application/json
      responses:
        "307":
          description: Redirect to Google OAuth consent screen
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Initiate Google OAuth login (Public)
      tags:
      - Auth
  /oauth/google/callback:
    get:
      consumes:
      - application/json
      description: Handles OAuth callback from Google. Exchanges authorization code
        for token and creates/updates user account.
      parameters:
      - description: OAuth state parameter for CSRF protection
        in: query
        name: state
        required: true
        type: string
      - description: OAuth authorization code from Google
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User logged in via Google successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid OAuth state
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Google OAuth callback (Public)
      tags:
      - Auth
  /payment:
    get:
