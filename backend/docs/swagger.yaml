      - Lesson Attendance
  /lessons/attendances/my-history:
    get:
      consumes:
      - application/json
      description: Get all attendance records for a student based on their enrollments.
      parameters:
      - description: Filter by enrollment ID
        in: query
        name: enrollment_id
