      tags:
      - Lesson Attendance
    put:
      consumes:
      - application/json
      description: Update attendance status and note. Admin only. Can only update
        status and note, not lesson/enrollment.
      parameters:
      - description: Attendance ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated attendance data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LessonAttendanceUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Attendance updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request data
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Admins only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Attendance or user not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to update attendance
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update attendance status and note (Admin Only)
      tags:
      - Lesson Attendance
