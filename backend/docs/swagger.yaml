      tags:
      - User
  /user/manage/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a user account permanently. Only administrators can perform
        this action. Admins cannot delete their own account.
      parameters:
      - description: User ID to delete
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - Invalid or missing JWT token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Only admins can delete users
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete user account (Admin Only)
      tags:
      - User Management
    patch:
      consumes:
      - application/json
      description: 'Update a specific user''s role. Only administrators can perform
        this action. Valid roles are: admin, mentor, student.'
      parameters:
      - description: User ID to update
        in: path
        name: id
        required: true
        type: integer
      - description: Role assignment (admin/mentor/student)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User role updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid role value
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - Invalid or missing JWT token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Only admins can update roles
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user role (Admin Only)
      tags:
      - User Management
  /user/manage/all:
    get:
      consumes:
      - application/json
      description: Retrieve paginated list of all users with optional filtering by
        role and search. Supports sorting by created_at or name. Admin only.
      parameters:
      - description: 'Page number (default: 1, minimum: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 5, max: 100)'
        in: query
        name: per_page
        type: integer
      - description: Filter by role (admin/mentor/student)
        in: query
        name: role
        type: string
      - description: Search by name or email (case-insensitive)
        in: query
        name: search
        type: string
      - description: 'Sort field: created_at (default) or name'
        in: query
        name: sort
        type: string
      - description: 'Sort order: asc or desc (default: desc)'
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Users retrieved successfully with pagination metadata
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - Invalid or missing JWT token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Only admins can access this endpoint
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all users with pagination (Admin Only)
      tags:
      - User Management
  /user/password:
    patch:
      consumes:
      - application/json
      description: Change authenticated user's password after verifying the old password.
        Requires old password verification before setting new password.
      parameters:
      - description: Password change data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request data or password validation failed
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized or incorrect old password
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change user password (All Roles)
      tags:
      - User
  /user/profile:
    patch:
      consumes:
      - application/json
      description: Update authenticated user's profile information including name,
        email, and description. All fields are optional and encrypted before storage.
      parameters:
      - description: Profile update data (all fields optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request data
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile (All Roles)
      tags:
      - User
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
