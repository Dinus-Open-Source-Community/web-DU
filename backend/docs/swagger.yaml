basePath: /
definitions:
  dto.APIResponse:
    properties:
      data:
        $ref: '#/definitions/dto.CreatePaymentResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.AssignMentorsToCourseRequest:
    properties:
      mentor_uids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - mentor_uids
    type: object
  dto.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.CreateClassTypeRequest:
    properties:
      description:
        example: Kelas intensif berbasis project
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Bootcamp
        type: string
    required:
    - name
    type: object
  dto.CreateCourseCategoryRequest:
    properties:
      description:
        example: Kategori course pengembangan web
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Web Development
        type: string
    required:
    - name
    type: object
  dto.CreateCourseQaReplyRequest:
    properties:
      body:
        type: string
    required:
    - body
    type: object
  dto.CreateCourseQaThreadRequest:
    properties:
      body:
        type: string
      title:
        type: string
    required:
    - body
    - title
    type: object
  dto.CreateCourseReviewReplyRequest:
    properties:
      comment:
        type: string
    required:
    - comment
    type: object
  dto.CreateCourseReviewRequest:
    properties:
      comment:
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - comment
    - rating
    type: object
  dto.CreateModuleRequest:
    properties:
      course_uid:
        example: 550e8400
        type: string
      order_index:
        example: 1
        type: integer
      title:
        example: Module 1
        type: string
    required:
    - course_uid
    - order_index
    - title
    type: object
  dto.CreatePaymentRequest:
    properties:
      amount:
        type: integer
      enrollment_uid:
        type: string
      method:
        enum:
        - PERMATAVA
        - BNIVA
        - BRIVA
        - MANDIRIVA
        - BCAVA
        - MUAMALATVA
        - CIMBVA
        - BSIVA
        - OCBCVA
        - DANAMONVA
        - OVO
        - DANA
        - QRIS2
        type: string
      order_items:
        items:
          $ref: '#/definitions/dto.OrderItem'
        minItems: 1
        type: array
      return_url:
        type: string
    required:
    - amount
    - method
    - order_items
    type: object
  dto.CreatePaymentResponse:
    properties:
      amount:
        type: integer
      amount_received:
        type: integer
      callback_url:
        type: string
      checkout_url:
        type: string
      customer_email:
        type: string
      customer_name:
        type: string
      customer_phone:
        type: string
      expired_time:
        type: integer
      fee_customer:
        type: integer
      fee_merchant:
        type: integer
      instructions:
        items:
          $ref: '#/definitions/dto.PaymentInstruction'
        type: array
      merchant_ref:
        type: string
      order_items:
        items:
          $ref: '#/definitions/dto.OrderItemResponse'
        type: array
      pay_code:
        type: string
      pay_url: {}
      payment_method:
        type: string
      payment_name:
        type: string
      payment_selection_type:
        type: string
      qr_string: {}
      qr_url: {}
      reference:
        type: string
      return_url:
        type: string
      status:
        type: string
      total_fee:
        type: integer
    type: object
  dto.LessonAssignmentSubmissionGradeRequest:
    properties:
      feedback:
        type: string
      passed:
        type: boolean
      score_percent:
        type: number
    required:
    - score_percent
    type: object
  dto.LessonAssignmentSubmissionUpsertRequest:
    properties:
      file_description:
        type: string
      plain_text:
        type: string
      quiz_answers: {}
      remove_file:
        type: boolean
      rich_text: {}
    type: object
  dto.LessonAssignmentUpsertRequest:
    properties:
      allow_file_submission:
        type: boolean
      allow_plain_text_submission:
        type: boolean
      allow_resubmit:
        type: boolean
      allow_rich_text_submission:
        type: boolean
      auto_close_after_deadline:
        type: boolean
      deadline_at:
        description: RFC3339 format
        type: string
      instruction_attachments: {}
      max_resubmit_count:
        type: integer
      quiz: {}
      require_file_description:
        type: boolean
      status:
        type: string
      task_description: {}
      task_type:
        type: string
      title:
        type: string
    required:
    - deadline_at
    - status
    - task_type
    - title
    type: object
  dto.LessonAttendanceCreateRequest:
    properties:
      enrollment_uid:
        type: string
      lesson_uid:
        type: string
      note:
        type: string
      status:
        enum:
        - present
        - late
        - absent
        - excused
        type: string
    required:
    - enrollment_uid
    - lesson_uid
    type: object
  dto.LessonAttendanceUpdateRequest:
    properties:
      note:
        type: string
      status:
        enum:
        - present
        - late
        - absent
        - excused
        type: string
    type: object
  dto.LessonCreateRequest:
    properties:
      content:
        description: accepts any JSON value
      content_type:
        type: string
      end_time:
        description: RFC3339 format
        type: string
      module_uid:
        type: string
      order_index:
        type: integer
      start_time:
        description: RFC3339 format
        type: string
      title:
        type: string
      video_url:
        type: string
    required:
    - module_uid
    - title
    type: object
  dto.LessonUpdateRequest:
    properties:
      content:
        description: accepts any JSON value
      content_type:
        type: string
      end_time:
        description: RFC3339 format
        type: string
      module_uid:
        type: string
      order_index:
        type: integer
      start_time:
        description: RFC3339 format
        type: string
      title:
        type: string
      video_url:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: StrongPassword123
        type: string
    required:
    - email
    - password
    type: object
  dto.OrderItem:
    properties:
      image_url:
        type: string
      name:
        type: string
      price:
        type: integer
      product_url:
        type: string
      quantity:
        type: integer
      sku:
        type: string
    required:
    - name
    - price
    - quantity
    type: object
  dto.OrderItemResponse:
    properties:
      image_url:
        type: string
      name:
        type: string
      price:
        type: integer
      product_url:
        type: string
      quantity:
        type: integer
      sku:
        type: string
      subtotal:
        type: integer
    type: object
  dto.PaymentInstruction:
    properties:
      steps:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      name:
        example: User DU
        type: string
      password:
        example: StrongPassword123
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.UpdateClassTypeRequest:
    properties:
      description:
        example: Kelas intensif berbasis project
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Bootcamp
        type: string
    type: object
  dto.UpdateCourseCategoryRequest:
    properties:
      description:
        example: Kategori course pengembangan web
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Web Development
        type: string
    type: object
  dto.UpdateModuleRequest:
    properties:
      order_index:
        example: 2
        type: integer
      title:
        example: Updated Module 1
        type: string
    type: object
  dto.UpdateUserProfileRequest:
    properties:
      description:
        type: string
      email:
        type: string
      name:
        type: string
    type: object
  dto.UpdateUserRoleRequest:
    properties:
      role:
        example: mentor
        type: string
    required:
    - role
    type: object
host: localhost:8080
info:
  contact: {}
  description: Documentation for Web DU Backend API.
  title: Web DU Backend
  version: "1.0"
paths:
  /admin/dashboard/kpis:
    get:
      consumes:
      - application/json
      description: Aggregate KPI metrics for the admin dashboard.
      parameters:
      - description: 'Period: 7d, 30d, 90d, 12m (default 30d)'
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Dashboard KPIs retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get admin dashboard KPIs
      tags:
      - Admin
  /admin/dashboard/recent-transactions:
    get:
      consumes:
      - application/json
      description: Retrieve recent transactions for the admin dashboard.
      parameters:
      - description: 'Number of items (default: 5)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Recent transactions retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get recent admin transactions
      tags:
      - Admin
  /admin/financial/summary:
    get:
      consumes:
      - application/json
      description: Revenue analytics for the admin financial page.
      produces:
      - application/json
      responses:
        "200":
          description: Financial summary retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get admin financial summary
      tags:
      - Admin
  /admin/qna:
    get:
      consumes:
      - application/json
      description: Retrieve paginated Q&A threads across courses.
      parameters:
      - description: Filter by course UID
        in: query
        name: courseUid
        type: string
      - description: answered or unanswered
        in: query
        name: status
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Q&A threads retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List Q&A threads (Admin)
      tags:
      - Admin
  /admin/qna/{thread_id}/replies:
    post:
      consumes:
      - application/json
      description: Create an admin reply on a Q&A thread.
      parameters:
      - description: Thread UID
        in: path
        name: thread_id
        required: true
        type: string
      - description: Reply body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCourseQaReplyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Q&A reply created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Thread not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Reply to a Q&A thread (Admin)
      tags:
      - Admin
  /admin/reviews:
    get:
      consumes:
      - application/json
      description: Retrieve paginated reviews across all courses for moderation.
      parameters:
      - description: Filter by course UID
        in: query
        name: courseUid
        type: string
      - description: Filter by rating
        in: query
        name: rating
        type: integer
      - description: Filter reviews with replies
        in: query
        name: has_reply
        type: boolean
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reviews retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List course reviews (Admin)
      tags:
      - Admin
  /admin/reviews/{review_id}/reply:
    post:
      consumes:
      - application/json
      description: Create an admin reply for a course review.
      parameters:
      - description: Review UID
        in: path
        name: review_id
        required: true
        type: string
      - description: Reply body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCourseReviewReplyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Review reply created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Review not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Reply to a review (Admin)
      tags:
      - Admin
  /admin/transactions:
    get:
      consumes:
      - application/json
      description: Retrieve paginated admin transaction list with summary counts.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: per_page
        type: integer
      - description: Filter by payment status
        in: query
        name: status
        type: string
      - description: Search by reference, course, or student
        in: query
        name: search
        type: string
      - description: Filter from date (YYYY-MM-DD or RFC3339)
        in: query
        name: date_from
        type: string
      - description: Filter to date (YYYY-MM-DD or RFC3339)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Transactions retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all transactions (Admin)
      tags:
      - Admin
  /avatar:
    post:
      consumes:
      - multipart/form-data
      description: 'Upload and update avatar. Allowed types: JPEG, PNG, GIF (animated
        GIFs are normalized to the first frame). Max size 5MiB enforced before processing
        and again after decode/re-encode.'
      parameters:
      - description: 'Avatar image file (max 5MB, supported: JPG, PNG, GIF)'
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Avatar updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Failed to process avatar file
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
        "413":
          description: File size exceeds 5MB limit
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user avatar (All Roles)
      tags:
      - User
  /course-categories:
    get:
      description: Public endpoint to retrieve all course categories.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: per_page
        type: integer
      - description: Search by category name
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Course categories retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to retrieve course categories
          schema:
            additionalProperties: true
            type: object
      summary: Get all course categories (Public)
      tags:
      - Course Category
    post:
      consumes:
      - application/json
      description: Create a new course category. Requires Super Admin or Admin.
      parameters:
      - description: Course category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCourseCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Course category created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Super Admin or Admin only'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to create course category
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create course category (Super Admin / Admin)
      tags:
      - Course Category
  /course-categories/{id}:
    delete:
      description: Delete course category by uid. Requires Super Admin or Admin.
      parameters:
      - description: Course Category UID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Course category deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid course category uid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Super Admin or Admin only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Course category not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to delete course category
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete course category (Super Admin / Admin)
      tags:
      - Course Category
    get:
      description: Public endpoint to retrieve a specific course category by uid.
      parameters:
      - description: Course Category UID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Course category retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid course category uid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Course category not found
          schema:
            additionalProperties: true
            type: object
      summary: Get course category by ID (Public)
      tags:
      - Course Category
    put:
      consumes:
      - application/json
      description: Update existing course category by uid. Requires Super Admin or
        Admin.
      parameters:
      - description: Course Category UID
        in: path
        name: id
        required: true
        type: string
      - description: Course category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCourseCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Course category updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Super Admin or Admin only'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Course category not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to update course category
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update course category (Super Admin / Admin)
      tags:
      - Course Category
  /course-types:
    get:
      description: Public endpoint to retrieve all course types.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: per_page
        type: integer
      - description: Search by course type name
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Course types retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to retrieve course types
          schema:
            additionalProperties: true
            type: object
      summary: Get all course types (Public)
      tags:
      - Course Type
    post:
      consumes:
      - application/json
      description: Create a new course type. Requires Super Admin or Admin.
      parameters:
      - description: Course type data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateClassTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Course type created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Super Admin or Admin only'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to create course type
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create course type (Super Admin / Admin)
      tags:
      - Course Type
  /course-types/{id}:
    delete:
      description: Delete course type by uid. Requires Super Admin or Admin.
      parameters:
      - description: Course Type UID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Course type deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid course type uid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
