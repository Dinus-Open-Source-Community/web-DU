      - Module
    put:
      consumes:
      - application/json
      description: Update an existing module's information. Admin only.
      parameters:
      - description: Module ID
        in: path
        name: id
        required: true
        type: integer
      - description: Module data to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateModuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Module updated successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Access denied: Admins only'
          schema:
            additionalProperties: true
