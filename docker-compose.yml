version: '3.9'
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app

