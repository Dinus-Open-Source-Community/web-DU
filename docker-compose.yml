services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/vite.config.ts:/app/vite.config.ts

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - BASE_URL=${BASE_URL}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - AES_KEY=${AES_KEY}
      - HMAC_KEY=${HMAC_KEY}
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT}
      - GARAGE_PUBLIC_ENDPOINT=${GARAGE_PUBLIC_ENDPOINT}
      - GARAGE_WEB_ENDPOINT=${GARAGE_WEB_ENDPOINT}
      - GARAGE_ADMIN_ENDPOINT=${GARAGE_ADMIN_ENDPOINT}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - GARAGE_REGION=${GARAGE_REGION}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
      - GARAGE_USE_SSL=${GARAGE_USE_SSL}
      - GARAGE_BUCKET_AVATARS=${GARAGE_BUCKET_AVATARS}
      - GARAGE_BUCKET_COURSES=${GARAGE_BUCKET_COURSES}
      - GARAGE_BUCKET_ASSIGNMENTS=${GARAGE_BUCKET_ASSIGNMENTS}
      - GARAGE_BUCKET_GALLERIES=${GARAGE_BUCKET_GALLERIES}
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - SEED=${SEED} # HAPUS SAJA PADA SAAT PRODUCTION
    volumes:
      - ./frontend/public/images:/app/seed-images:ro
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_started

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5430:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8013:8080"

  garage:
    image: dxflrs/garage:v2.4.1
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
    command: /garage server --single-node --default-access-key
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

volumes:
  db_data:
  garage_meta:
  garage_data:
