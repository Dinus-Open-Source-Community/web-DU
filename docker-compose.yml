services:
  frontend:
    image: localhost/web-du-frontend:latest
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    image: localhost/web-du-backend:latest
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - BASE_URL=${BASE_URL}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-20}
      - REDIS_DIAL_TIMEOUT=${REDIS_DIAL_TIMEOUT:-5s}
      - REDIS_READ_TIMEOUT=${REDIS_READ_TIMEOUT:-3s}
      - REDIS_WRITE_TIMEOUT=${REDIS_WRITE_TIMEOUT:-3s}
      - REDIS_AUTH_CACHE_TTL=${REDIS_AUTH_CACHE_TTL:-45s}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDEEM_CODE_API_KEY=${REDEEM_CODE_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SSO_BASE_URL=${SSO_BASE_URL}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET}
      - SSO_REDIRECT_URI=${SSO_REDIRECT_URI}
      - AES_KEY=${AES_KEY}
      - HMAC_KEY=${HMAC_KEY}
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT}
      - GARAGE_PUBLIC_ENDPOINT=${GARAGE_PUBLIC_ENDPOINT}
      - GARAGE_WEB_ENDPOINT=${GARAGE_WEB_ENDPOINT}
      - GARAGE_ADMIN_ENDPOINT=${GARAGE_ADMIN_ENDPOINT}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - GARAGE_REGION=${GARAGE_REGION}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
      - GARAGE_USE_SSL=${GARAGE_USE_SSL}
      - GARAGE_BUCKET_AVATARS=${GARAGE_BUCKET_AVATARS}
      - GARAGE_BUCKET_COURSES=${GARAGE_BUCKET_COURSES}
      - GARAGE_BUCKET_ASSIGNMENTS=${GARAGE_BUCKET_ASSIGNMENTS}
      - GARAGE_BUCKET_GALLERIES=${GARAGE_BUCKET_GALLERIES}
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_started

  db:
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5430:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server; fi"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: docker.io/library/adminer:latest
    ports:
      - "8013:8080"

  garage:
    image: docker.io/dxflrs/garage:v2.4.1
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
    command: /garage server --single-node --default-access-key
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

volumes:
  db_data:
  garage_meta:
  garage_data:
  redis_data:
